<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Respawn">
  <title>Respawn</title>
  <!--
    The navbar mark (a dashed orbit around a glowing diamond) reduced for a 16px tab:
    four chunky arcs instead of many fine dashes, which would smear into a ring at that size.
  -->
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#33EBFF" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#33EBFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8FF6FF"/>
      <stop offset="52%" stop-color="#33EBFF"/>
      <stop offset="100%" stop-color="#D456FB"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- deep space panel -->
  <rect width="64" height="64" rx="15" fill="#040510"/>
  <circle cx="32" cy="32" r="23" fill="url(#halo)"/>

  <!-- orbit: circumference 157.08 split into 4 arcs -->
  <circle cx="32" cy="32" r="25" fill="none" stroke="#33EBFF" stroke-opacity=".9"
          stroke-width="4" stroke-linecap="round" stroke-dasharray="22.78 16.49"/>

  <!-- the diamond, ion cyan bleeding into plasma violet -->
  <g filter="url(#glow)">
    <rect x="19.63" y="19.63" width="24.75" height="24.75" rx="2.4"
          fill="url(#gem)" transform="rotate(45 32 32)"/>
  </g>
</svg>
